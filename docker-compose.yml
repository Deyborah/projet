version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - mongo
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=dbauxcreationsfilees
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=12345678
      - MONGO_URL=mongodb://mongo:27017/appdb

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: dbauxcreationsfilees
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata: